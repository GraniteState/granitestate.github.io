name: Validate knowledge base

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON-LD
        run: python3 scripts/validate_kb.py
      - name: Rebuild matches committed files
        run: python3 scripts/build_kb.py --check
