name: Validate knowledge base

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON-LD
        run: python3 scripts/validate_kb.py
      - name: Rebuild matches committed files
        run: python3 scripts/build_kb.py --check
      - name: RSA citation parser
        run: python3 scripts/build_rsa.py --self-test
      - name: Validate RSA pages
        run: python3 scripts/validate_rsa.py
      - name: Rules citation linker
        run: python3 scripts/build_rules.py --self-test
      - name: Validate rule pages
        run: python3 scripts/validate_rules.py
